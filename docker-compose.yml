services:
  playwright:
    build: .
    environment:
      BASE_URL: ${{ secrets.BASE_URL }}
      USERNAME: ${{ secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }}
      TEST_ENV: ${{ secrets.TEST_ENV }}

    image: mcr.microsoft.com/playwright:v1.61.1-noble
    working_dir: /app

    volumes:
      - ./:/app

    command: >
      bash -c "
      npm ci &&
      npx playwright test
      "
